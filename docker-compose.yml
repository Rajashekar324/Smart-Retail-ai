version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stylehub-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/stylehub
      - MONGODB_URI=mongodb://mongo:27017/stylehub
      - REDIS_URL=redis://redis:6379
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_SEARCH_KEY=${AZURE_SEARCH_KEY}
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
      - mongo
      - redis
      - chromadb
    networks:
      - stylehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: stylehub-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=stylehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - stylehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Document Storage
  mongo:
    image: mongo:6.0
    container_name: stylehub-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=stylehub
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - stylehub-network
    restart: unless-stopped

  # Redis for Caching and Sessions
  redis:
    image: redis:7-alpine
    container_name: stylehub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stylehub-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ChromaDB for Vector Storage
  chromadb:
    image: chromadb/chroma:latest
    container_name: stylehub-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - stylehub-network
    restart: unless-stopped

  # ML Model Serving (Optional - for model deployment)
  ml-server:
    build:
      context: ./ml
      dockerfile: Dockerfile.ml
    container_name: stylehub-ml
    ports:
      - "8002:8000"
    environment:
      - MODEL_PATH=/models
      - AZURE_ML_WORKSPACE=${AZURE_ML_WORKSPACE}
    volumes:
      - ./models:/models
    networks:
      - stylehub-network
    restart: unless-stopped
    profiles:
      - ml

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: stylehub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - stylehub-network
    restart: unless-stopped

  # Celery Worker for Background Tasks
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stylehub-celery
    command: celery -A app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/stylehub
      - REDIS_URL=redis://redis:6379
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    volumes:
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - stylehub-network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stylehub-celery-beat
    command: celery -A app.celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/stylehub
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - stylehub-network
    restart: unless-stopped

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: stylehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - stylehub-network
    restart: unless-stopped

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: stylehub-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - stylehub-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  stylehub-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
