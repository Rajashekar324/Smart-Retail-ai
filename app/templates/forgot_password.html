{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <div class="glass-card">
        <h1 style="text-align: center; margin-bottom: 30px;">Forgot Password</h1>
        
        {% if error %}
        <div class="alert alert-error" style="background: #fee; color: #c33; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success" style="background: #efe; color: #3c3; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            {{ success }}
        </div>
        {% endif %}
        
        <form method="post" action="/forgot-password">
            <div style="margin-bottom: 20px;">
                <label for="email" style="display: block; margin-bottom: 8px; font-weight: 500;">Email Address</label>
                <input type="email" id="email" name="email" required 
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 16px;">
                Send Reset Link
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="/login" style="color: #0066cc;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
