{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <div class="glass-card">
        <h1 style="text-align: center; margin-bottom: 30px;">Reset Password</h1>
        
        {% if error %}
        <div class="alert alert-error" style="background: #fee; color: #c33; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success" style="background: #efe; color: #3c3; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            {{ success }}
        </div>
        {% endif %}
        
        {% if token %}
        <form method="post" action="/reset-password">
            <input type="hidden" name="token" value="{{ token }}">
            
            <div style="margin-bottom: 20px;">
                <label for="new_password" style="display: block; margin-bottom: 8px; font-weight: 500;">New Password</label>
                <input type="password" id="new_password" name="new_password" required minlength="6"
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="confirm_password" style="display: block; margin-bottom: 8px; font-weight: 500;">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 16px;">
                Reset Password
            </button>
        </form>
        {% else %}
        <div style="text-align: center; margin-top: 20px;">
            <a href="/forgot-password" class="btn">Request New Reset Link</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
