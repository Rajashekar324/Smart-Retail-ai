{% extends "base.html" %}

{% block content %}
<div style="width: 100%; padding: 0 30px; margin-top: 50px; box-sizing: border-box;">
    <h1 style="margin-bottom: 30px;">👥 User Management</h1>
    
    <!-- Suspicious Users Alert -->
    <div id="suspiciousAlert" style="display: none; margin-bottom: 30px;"></div>
    
    <!-- User Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <div class="glass-card" style="text-align: center; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px;">
            <div id="totalUsers" style="font-size: 32px; font-weight: bold;">-</div>
            <div style="margin-top: 5px;">Total Users</div>
        </div>
        <div class="glass-card" style="text-align: center; padding: 20px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border-radius: 8px;">
            <div id="activeUsers" style="font-size: 32px; font-weight: bold;">-</div>
            <div style="margin-top: 5px;">Active (30d)</div>
        </div>
        <div class="glass-card" style="text-align: center; padding: 20px; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; border-radius: 8px;">
            <div id="newUsers" style="font-size: 32px; font-weight: bold;">-</div>
            <div style="margin-top: 5px;">New (7d)</div>
        </div>
        <div class="glass-card" style="text-align: center; padding: 20px; background: linear-gradient(135deg, #10b981 0%, #34d399 100%); color: white; border-radius: 8px;">
            <div id="totalSpent" style="font-size: 32px; font-weight: bold;">₹0</div>
            <div style="margin-top: 5px;">Total Spent</div>
        </div>
        <div class="glass-card" style="text-align: center; padding: 20px; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%); color: white; border-radius: 8px;">
            <div id="suspiciousCount" style="font-size: 32px; font-weight: bold;">-</div>
            <div style="margin-top: 5px;">Suspicious</div>
        </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
        <!-- Users Table -->
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">All Users</h2>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #f5f5f5;">
                            <th style="padding: 12px; text-align: left;">User</th>
                            <th style="padding: 12px; text-align: center;">Role</th>
                            <th style="padding: 12px; text-align: center;">Created</th>
                            <th style="padding: 12px; text-align: center;">Last Activity</th>
                            <th style="padding: 12px; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="5" style="padding: 20px; text-align: center; color: #666;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Audit Logs -->
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">📜 Audit Logs</h2>
            <div id="auditLogs" style="max-height: 500px; overflow-y: auto;">
                <p style="color: #666;">Loading...</p>
            </div>
        </div>
    </div>
    
    <!-- User Activity Modal -->
    <div id="activityModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 8px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto;">
            <h3 id="activityModalTitle" style="margin-bottom: 20px;">User Activity</h3>
            <div id="activityModalContent"></div>
            <button onclick="closeActivityModal()" class="btn" style="margin-top: 20px; width: 100%;">Close</button>
        </div>
    </div>
</div>

<script>
async function loadUsers() {
    try {
        const response = await fetch('/api/admin/users');
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const data = await response.json();
        
        if (data.users) {
            document.getElementById('totalUsers').textContent = data.users.length;            document.getElementById('totalSpent').textContent = `₹${(data.total_spent || 0).toFixed(0)}`;            
            // Calculate active users (last 30 days)
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            const activeUsers = data.users.filter(u => u.last_activity && new Date(u.last_activity) > thirtyDaysAgo);
            document.getElementById('activeUsers').textContent = activeUsers.length;
            
            // Calculate new users (last 7 days)
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const newUsers = data.users.filter(u => u.created_at && new Date(u.created_at) > sevenDaysAgo);
            document.getElementById('newUsers').textContent = newUsers.length;
            
            // Populate table
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = data.users.map(u => `
                <tr style="border-bottom: 1px solid #ddd;">
                    <td style="padding: 12px;">
                        <strong>${u.name}</strong>
                        <div style="color: #666; font-size: 14px;">${u.email}</div>
                    </td>
                    <td style="padding: 12px; text-align: center;">
                        ${u.is_admin ? '<span style="background: #667eea; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Admin</span>' : 
                          (u.roles && u.roles.map ? u.roles.map(r => `<span style="background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${r}</span>`).join(' ') : 'Customer')}
                    </td>
                    <td style="padding: 12px; text-align: center; font-size: 14px; color: #666;">${u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A'}</td>
                    <td style="padding: 12px; text-align: center; font-size: 14px; color: #666;">${u.last_activity ? new Date(u.last_activity).toLocaleDateString() : 'Never'}</td>
                    <td style="padding: 12px; text-align: center;">
                        <button onclick="viewUserActivity(${u.id}, '${u.name}')" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;">Activity</button>
                    </td>
                </tr>
            `).join('');
        } else {
            document.getElementById('usersTable').innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: #c33;">Error: ${JSON.stringify(data)}</td></tr>`;
        }
    } catch (error) {
        console.error('Error loading users:', error);
        document.getElementById('usersTable').innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: #c33;">Error loading users: ${error.message}</td></tr>`;
    }
}

async function loadSuspiciousUsers() {
    try {
        const response = await fetch('/api/admin/users/suspicious');
        const data = await response.json();
        
        const count = data.suspicious_users ? data.suspicious_users.length : 0;
        document.getElementById('suspiciousCount').textContent = count;
        
        if (count > 0) {
            const alertDiv = document.getElementById('suspiciousAlert');
            alertDiv.style.display = 'block';
            alertDiv.innerHTML = `
                <div style="padding: 20px; background: #fff5f5; border-left: 4px solid #c33; border-radius: 8px;">
                    <h3 style="color: #c33; margin-bottom: 15px;">⚠️ ${count} Suspicious Users Detected</h3>
                    <div style="display: grid; gap: 10px;">
                        ${data.suspicious_users.map(s => `
                            <div style="padding: 12px; background: white; border-radius: 6px;">
                                <strong>${s.email}</strong> - ${s.type}
                                <div style="color: #666; font-size: 14px;">${s.message}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    } catch (error) {
        console.error('Error loading suspicious users:', error);
    }
}

async function viewUserActivity(userId, userName) {
    document.getElementById('activityModalTitle').textContent = `Activity: ${userName}`;
    document.getElementById('activityModalContent').innerHTML = '<p style="color: #666;">Loading...</p>';
    document.getElementById('activityModal').style.display = 'block';
    
    try {
        const response = await fetch(`/api/admin/users/${userId}/activity`);
        const data = await response.json();
        
        document.getElementById('activityModalContent').innerHTML = `
            <div style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 6px;">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center;">
                    <div>
                        <div style="font-size: 24px; font-weight: bold; color: #667eea;">${data.login_count}</div>
                        <div style="font-size: 12px; color: #666;">Logins (30d)</div>
                    </div>
                    <div>
                        <div style="font-size: 24px; font-weight: bold; color: #667eea;">${data.orders_count}</div>
                        <div style="font-size: 12px; color: #666;">Orders (30d)</div>
                    </div>
                    <div>
                        <div style="font-size: 24px; font-weight: bold; color: #667eea;">₹${data.total_spent ? data.total_spent.toFixed(0) : 0}</div>
                        <div style="font-size: 12px; color: #666;">Spent (30d)</div>
                    </div>
                </div>
            </div>
            <h4 style="margin-bottom: 10px;">Recent Activity</h4>
            <div style="display: grid; gap: 8px;">
                ${data.recent_activities && data.recent_activities.length > 0 ? 
                    data.recent_activities.map(a => `
                        <div style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                            <strong>${a.type}</strong>
                            <div style="color: #666;">${a.details || ''}</div>
                            <div style="color: #999; font-size: 12px;">${new Date(a.timestamp).toLocaleString()}</div>
                        </div>
                    `).join('') : 
                    '<p style="color: #666;">No recent activity</p>'
                }
            </div>
        `;
    } catch (error) {
        document.getElementById('activityModalContent').innerHTML = `<p style="color: #c33;">Error loading activity</p>`;
    }
}

function closeActivityModal() {
    document.getElementById('activityModal').style.display = 'none';
}

async function loadAuditLogs() {
    try {
        const response = await fetch('/api/admin/audit-logs?limit=50');
        const data = await response.json();
        
        const container = document.getElementById('auditLogs');
        if (data.logs && data.logs.length > 0) {
            container.innerHTML = data.logs.map(log => `
                <div style="padding: 10px; border-bottom: 1px solid #eee; font-size: 13px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <strong>${log.action}</strong>
                        <span style="color: #999;">${new Date(log.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div style="color: #666;">
                        ${log.entity_type}: ${log.entity_id || 'N/A'}
                        ${log.user_id ? `by User #${log.user_id}` : ''}
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<p style="color: #666;">No audit logs</p>';
        }
    } catch (error) {
        console.error('Error loading audit logs:', error);
    }
}

// Load data
loadUsers();
loadSuspiciousUsers();
loadAuditLogs();

// Refresh every minute
setInterval(() => {
    loadUsers();
    loadSuspiciousUsers();
}, 60000);
</script>
{% endblock %}
